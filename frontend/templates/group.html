<div id="group-tab" class="tab-content">
    <div class="form-group">
        <label>Сессия проверки (группа)</label>
        <div style="display:flex;gap:.5rem;align-items:center">
            <select id="g-group-select" class="input-field" style="flex:1">
                <option value="">— без группы —</option>
            </select>
            <button type="button" class="btn btn-small" id="g-group-new">+ Новая</button>
        </div>
    </div>
    <form id="group-form">
        <div class="form-group">
            <label>Текст задания</label>
            <textarea id="g-task" rows="3" placeholder="Опишите задание..." required></textarea>
        </div>
        <div class="form-group">
            <label>Критерии оценивания</label>
            <textarea id="g-criteria" rows="4" placeholder="1. Полнота ответа (0-3 балла)&#10;2. Ключевые понятия (0-3)&#10;3. Логика и структура (0-2)&#10;4. Язык и грамотность (0-2)" required></textarea>
        </div>
        <div id="g-students"></div>
        <button type="button" class="btn-add" id="g-add">+ Добавить ученика</button>
        <button type="submit" class="btn" id="g-submit">Проверить всех</button>
    </form>
    <div id="group-results"></div>
</div>
